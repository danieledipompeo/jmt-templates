name: validate
on:
  pull_request:
    paths: ["templates/**", "scripts/**", "tests/**", "schema/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y libxml2-utils
      - name: Script tests
        run: python3 -m unittest discover -s tests
      - name: Changed files (submissions from non-owners may only touch templates/)
        if: github.event.pull_request.author_association != 'OWNER'
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
      - name: Validate templates
        run: |
          CHANGED=""
          if [ -f /tmp/changed.txt ]; then CHANGED="--changed /tmp/changed.txt"; fi
          python3 scripts/validate.py $CHANGED templates/*.jsimgt
      - name: Schema check
        run: xmllint --noout --schema schema/jsimgt.xsd templates/*.jsimgt
