name: validate
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y libxml2-utils
      # The checker and schema come from the base branch so a PR cannot weaken the rules it is judged by.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Changed files (submissions from non-owners may only touch templates/)
        if: github.event.pull_request.author_association != 'OWNER'
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
      - name: Validate templates
        run: |
          CHANGED=""
          if [ -f /tmp/changed.txt ]; then CHANGED="--changed /tmp/changed.txt"; fi
          python3 base/scripts/validate.py $CHANGED templates/*.jsimgt
      - name: Schema check
        run: |
          status=0
          for f in templates/*.jsimgt; do
            schema=base/schema/jsimgt.xsd
            if [ "$(xmllint --nonet --xpath 'string(/jsimgt/@version)' "$f")" = 2 ]; then schema=base/schema/jsimgt2.xsd; fi
            xmllint --nonet --noout --schema "$schema" "$f" || status=1
          done
          exit $status
